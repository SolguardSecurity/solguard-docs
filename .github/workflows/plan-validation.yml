name: Plan validation

on:
  pull_request:
    paths:
      - "changelogs/25-26-jul-2026/tasks/**"
      - "docs/governance/**"
      - "scripts/validate-governance-program.mjs"
      - "test/governance-program.test.mjs"
      - ".github/workflows/plan-validation.yml"
  push:
    branches:
      - main
    paths:
      - "changelogs/25-26-jul-2026/tasks/**"
      - "docs/governance/**"
      - "scripts/validate-governance-program.mjs"
      - "test/governance-program.test.mjs"
      - ".github/workflows/plan-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-final-plan:
    name: Validate final plan
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: changelogs/25-26-jul-2026/tasks

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.16.0"

      - name: Verify generated artifacts are current
        run: |
          node rebuild-final-plan.mjs
          git diff --exit-code -- \
            acceptance-ledger.v1.json \
            07_CHECKLIST_MAESTRA.md \
            09_CONTRATOS_LEDGER_Y_DEPENDENCIAS.md \
            README.md

      - name: Validate canonical plan
        run: node validate-final-plan.mjs

      - name: Run generator and reader tests
        run: node --test

      - name: Run repository contract tests
        working-directory: .
        run: node --test
